<!doctype html>
<meta charset="utf-8">
<title>fpp dom gate</title>
<body>
<script type="module">
  import { instantiate } from '/stdlib/fpp-js.mjs';
  window.log = [];
  try {
    const exports = await instantiate('domdemo.wasm', {
      sink: s => window.log.push(s.trimEnd()) });
    exports._start();
    const btn = document.getElementById('typed');
    btn.dispatchEvent(new MouseEvent('click', { clientX: 41 }));
    btn.dispatchEvent(new MouseEvent('click', { clientX: 77 }));
    window.results = {
      log: window.log.filter(x => x !== ''),
      text: btn.textContent,
      cls: btn.className,
      width: btn.style.width,
      clicks: exports.getClicks(0),
      lastX: exports.getLastX(0),
    };
  } catch (e) {
    window.results = { error: String(e && e.stack || e) };
  }
  window.ready = true;
</script>
