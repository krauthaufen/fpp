<!doctype html>
<meta charset="utf-8">
<title>F++ WebGPU</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:ui-monospace,monospace; padding:2rem; }
  h1 { color:#58a6ff; font-size:1.15rem; }
  canvas { border:1px solid #30363d; border-radius:8px; }
  #s { color:#d29922; margin-top:.6rem; }
</style>
<h1>F++ vertices &rarr; linear memory &rarr; ArrayBuffer &rarr; WebGPU</h1>
<canvas id="cv" width="480" height="480"></canvas>
<div id="s">starting…</div>
<script type="module">
const status = m => document.getElementById("s").textContent = m;
try {
  // 1. run the F++ module — it writes interleaved [x,y,r,g,b] f32 vertices
  let inst, text = "";
  const dec = new TextDecoder();
  const wasi_snapshot_preview1 = { fd_write(fd, iovs, cnt, nw) {
    const dv = new DataView(inst.exports.memory.buffer);
    let w = 0;
    for (let i = 0; i < cnt; i++) {
      const p = dv.getUint32(iovs + i*8, true), l = dv.getUint32(iovs + i*8+4, true);
      text += dec.decode(new Uint8Array(inst.exports.memory.buffer, p, l)); w += l;
    }
    dv.setUint32(nw, w, true); return 0;
  }};
  const r = await fetch("gpu.wasm");
  ({ instance: inst } = await WebAssembly.instantiate(await r.arrayBuffer(), { wasi_snapshot_preview1, env: {} }));
  inst.exports._start();
  const nVerts = parseInt(text.trim());

  // 2. zero-copy view over the F++ module's linear memory
  const verts = new Float32Array(inst.exports.memory.buffer, 4096, nVerts * 5);

  // 3. straight into WebGPU
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const ctx = document.getElementById("cv").getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format });
  const vbuf = device.createBuffer({ size: verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vbuf, 0, verts);
  const shader = device.createShaderModule({ code: `
    struct VOut { @builtin(position) pos : vec4f, @location(0) col : vec3f }
    @vertex fn vs(@location(0) p : vec2f, @location(1) c : vec3f) -> VOut {
      var o : VOut; o.pos = vec4f(p, 0.0, 1.0); o.col = c; return o;
    }
    @fragment fn fs(@location(0) c : vec3f) -> @location(0) vec4f { return vec4f(c, 1.0); }` });
  const pipeline = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: shader, entryPoint: "vs", buffers: [{ arrayStride: 20, attributes: [
      { shaderLocation: 0, offset: 0, format: "float32x2" },
      { shaderLocation: 1, offset: 8, format: "float32x3" }]}] },
    fragment: { module: shader, entryPoint: "fs", targets: [{ format }] },
    primitive: { topology: "triangle-list" }
  });
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(),
    clearValue: { r: 0.05, g: 0.07, b: 0.1, a: 1 }, loadOp: "clear", storeOp: "store" }] });
  pass.setPipeline(pipeline); pass.setVertexBuffer(0, vbuf); pass.draw(nVerts); pass.end();
  device.queue.submit([enc.finish()]);
  status(`F++ generated ${nVerts} vertices (${verts.byteLength} bytes, zero-copy) — rendered on ${(await adapter.requestAdapterInfo?.())?.description ?? "GPU"}`);
} catch (e) { status("ERROR: " + e.message); }
</script>
