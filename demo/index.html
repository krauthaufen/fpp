<!doctype html>
<meta charset="utf-8">
<title>F++ demo</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:ui-monospace,monospace; padding:2rem; }
  h1 { color:#58a6ff; font-size:1.2rem; }
  canvas { background:#161b22; border:1px solid #30363d; border-radius:8px; image-rendering:pixelated; }
  #status { color:#d29922; margin-top:.6rem; }
  #log { color:#8b949e; }
</style>
<h1>F++ &rarr; wasm: Rule 90, drawn through JS externs</h1>
<canvas id="cv" width="516" height="256"></canvas>
<div id="log"></div>
<div id="status"></div>
<script type="module">
import { instantiateLinear } from "../stdlib/fpp-js.mjs";
const ctx = document.getElementById("cv").getContext("2d");
ctx.fillStyle = "#58a6ff";
let text = "";
const mod = await instantiateLinear("demo.wasm", {
  sink: s => { text += s; document.getElementById("log").textContent = text; },
  jsx: {
    jsRect: (x, y, on) => { ctx.fillRect(x*4, y*4, 4, 4); return 0; },
    jsStatus: s => { document.getElementById("status").textContent = s; return 0; },
  },
});
mod._start();
</script>
