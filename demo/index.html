<!doctype html>
<meta charset="utf-8">
<title>F++ demo</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:ui-monospace,monospace; padding:2rem; }
  h1 { color:#58a6ff; font-size:1.2rem; }
  canvas { background:#161b22; border:1px solid #30363d; border-radius:8px; image-rendering:pixelated; }
  #status { color:#d29922; margin-top:.6rem; }
  #log { color:#8b949e; }
</style>
<h1>F++ &rarr; wasm-GC: Rule 90, drawn through JS externs</h1>
<canvas id="cv" width="516" height="256"></canvas>
<div id="log"></div>
<div id="status"></div>
<script type="module">
const ctx = document.getElementById("cv").getContext("2d");
ctx.fillStyle = "#58a6ff";
let text = "", inst;
const decoder = new TextDecoder();

const wasi_snapshot_preview1 = {
  fd_write(fd, iovs, iovcnt, nwritten) {
    const dv = new DataView(inst.exports.memory.buffer);
    let w = 0;
    for (let i = 0; i < iovcnt; i++) {
      const p = dv.getUint32(iovs + i*8, true), l = dv.getUint32(iovs + i*8+4, true);
      text += decoder.decode(new Uint8Array(inst.exports.memory.buffer, p, l)); w += l;
    }
    dv.setUint32(nwritten, w, true); return 0;
  }
};

// read an F++ string handle through the module's exported accessors
const readStr = h => {
  const n = inst.exports.str_len(h), bytes = new Uint8Array(n);
  for (let i = 0; i < n; i++) bytes[i] = inst.exports.str_get(h, i);
  return decoder.decode(bytes);
};

const env = {
  jsRect: (x, y, on) => { ctx.fillRect(x*4, y*4, 4, 4); return 0; },
  jsStatus: h => { document.getElementById("status").textContent = readStr(h); return 0; }
};

const r = await fetch("demo.wasm");
({ instance: inst } = await WebAssembly.instantiate(await r.arrayBuffer(), { wasi_snapshot_preview1, env }));
inst.exports._start();
document.getElementById("log").textContent = text;
</script>
